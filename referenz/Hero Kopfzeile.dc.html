<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:92},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'tablet'|'mobile'&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.size ?? 'desktop', l = (this.props.tone ?? 'dark') === 'light';
    return {
      dD: s === 'desktop' && !l, dL: s === 'desktop' && l,
      tD: s === 'tablet' && !l, tL: s === 'tablet' && l,
      mD: s === 'mobile' && !l, mL: s === 'mobile' && l
    };
  }
}
